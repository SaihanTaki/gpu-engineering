name: Kernels

on:
  push:
    paths: ['kernels/**', '.github/workflows/kernels.yml']
  pull_request:
    paths: ['kernels/**', '.github/workflows/kernels.yml']

permissions:
  contents: read

jobs:
  test-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install numpy pytest "numba-cuda[cu13]==0.30.4" triton==3.8.0
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      # No GPU on hosted runners; kernels/conftest.py switches Numba and
      # Triton to their CPU modes.
      - run: pytest kernels -v

  compile-cuda:
    runs-on: ubuntu-latest
    container: nvidia/cuda:13.2.1-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install make and a host compiler
        run: apt-get update && apt-get install -y --no-install-recommends make g++
      - name: Compile every chapter's CUDA C++ code
        run: |
          for d in kernels/*/cuda; do
            [ -d "$d" ] || continue
            make -C "$d" all
          done
